# .github/workflows/profile.yml
name: Profile cards
on:
  schedule: [{cron: "0 6 * * 1"}]   # Mondays, 06:00 UTC
  workflow_dispatch:
  push: {branches: [main]}

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production   # holds METRICS_TOKEN
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}   # PAT, so private repos are counted
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate.mjs
      - name: Test (checks the freshly generated cards too)
        run: node --test
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          git diff --staged --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
